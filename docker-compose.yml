name: salad-bzminer-worker

services:
  miner:
    build:
      context: .
    image: salad-bzminer-worker:local
    container_name: salad-bzminer-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
